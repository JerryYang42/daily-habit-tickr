[project]
name = "habits"
version = "0.1.0"
description = "A local-first, encouraging terminal habit tracker."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jerry Yang" }]
dependencies = [
    "textual>=8.0",
    "platformdirs>=4.0",
    "uuid-utils>=0.9; python_version < '3.14'",
]

[project.scripts]
habits = "habits.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-textual-snapshot>=1.0",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habits"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Box/emoji glyphs are intentional in UI copy.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/habits"]

[[tool.mypy.overrides]]
module = ["uuid_utils"]
ignore_missing_imports = true
