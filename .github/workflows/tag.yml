name: Tag release

# Runs after CI succeeds on a push to main and tags the commit with the next
# semantic version, derived from Conventional Commit messages since the last tag:
#   BREAKING CHANGE / "type!:"  -> major
#   feat:                       -> minor
#   anything else               -> patch

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # full history and tags

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail

          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "HEAD is already tagged; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            last="v0.0.0"
            range="HEAD"
          else
            range="$last..HEAD"
          fi

          if [ "$(git rev-list --count "$range")" = "0" ]; then
            echo "No commits since $last."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subjects=$(git log "$range" --format='%s')
          bodies=$(git log "$range" --format='%b')

          if echo "$subjects" | grep -Eq '^[a-z]+(\([^)]*\))?!:' \
             || echo "$bodies" | grep -Eq '^BREAKING[ -]CHANGE:'; then
            bump=major
          elif echo "$subjects" | grep -Eq '^feat(\([^)]*\))?:'; then
            bump=minor
          else
            bump=patch
          fi

          IFS=. read -r major minor patch <<< "${last#v}"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="v$major.$minor.$patch"

          echo "$last -> $next ($bump)"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
